# Crosswalk de instituições do SNS — snsRadar
#
# Cada entrada é uma entidade canónica, com todas as chaves normalizadas sob as
# quais a fonte a designou ao longo do tempo. Sem este ficheiro nenhuma série
# atravessa janeiro de 2024: a reforma das Unidades Locais de Saúde
# (Decreto-Lei n.º 102/2023, de 7 de novembro) renomeou 32 entidades de uma vez.
#
# As `chaves` são a forma devolvida por ingest/common.py::normalizar_agressivo
# (minúsculas, sem acentos, sem pontuação, sem forma jurídica, sem preposições).
# Uma única chave cobre as várias grafias com que a fonte escreve o mesmo nome
# — «E.P.E.», «E. P. E.», «EPE», maiúsculas, barras com e sem espaços.
#
# `sucessao` documenta cada mudança de identidade com a sua base legal. Quando
# `de` tem mais do que um elemento, a série anterior e a posterior NÃO
# representam o mesmo perímetro: o site tem de o dizer ao leitor.
#
# Fontes: Decreto-Lei n.º 102/2023 (Diário da República, 1.ª série, n.º 215,
# 7 de novembro de 2023, pp. 4-20), artigo 1.º, alíneas a) a ff).

