- id: ocupacao-internamento
  titulo: Taxa de ocupação do internamento
  grupo: capacidade
  dataset: ocupacao-do-internamento
  acumulado_no_ano: true
  denominador_acumulado_no_ano: false
  denominador_x_dias_do_mes: true
  numerador: no_de_dias_de_internamento
  denominador: lotacao_praticada
  publicado: taxa_anual_de_ocupacao_em_internamento
  unidade: percentagem
  polaridade: neutro
  # Único indicador de percentagem que pode legitimamente passar dos 100 %: os
  # dias de internamento podem exceder as camas disponíveis quando se abrem
  # camas extra. Nos restantes, o numerador está contido no denominador e um
  # valor acima de 100 % só pode ser erro de cálculo.
  pode_exceder_100: true
  # Mas não sem limite. A lotação praticada vem errada em 632 meses de 13
  # unidades — a ULS da Lezíria aparece com 10 camas em janeiro de 2014, quando
  # tem cerca de 382, o que produz uma ocupação de 3 684%. Um hospital
  # genuinamente cheio chega aos 130%; acima de 200% o denominador está errado,
  # não o hospital. Nesses meses não se apresenta taxa — as contagens ficam.
  maximo_plausivel: 200
  cautela: >-
    O denominador é a lotação praticada, que varia com camas abertas e
    encerradas. Ocupação alta pode significar eficiência ou pressão excessiva;
    ocupação baixa pode significar folga ou camas encerradas por falta de
    pessoal.

