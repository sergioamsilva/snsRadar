- id: fratura-anca-48h
  titulo: Fraturas da anca operadas nas primeiras 48 horas
  grupo: qualidade
  dataset: fraturas-da-anca-cirurgias-nas-primeiras-48h
  acumulado_no_ano: true
  numerador: no_episodios_utentes_idade_sup_65_anos_com_diag_princ_820_com_cir_realiz_nas_1as_48h_apos_admissao
  denominador: n_episodios_utentes_idade_sup_65_anos_com_diag_princ_820_com_cirurgia_realizada
  publicado: fraturas_anca_com_cirurgia_realizada_nas_primeiras_48_horas
  unidade: percentagem
  polaridade: subir_e_bom
  descricao: >-
    Doentes com mais de 65 anos. Operar nas primeiras 48 horas está associado a
    menor mortalidade e menor perda de autonomia.
  evidencia:
    - citacao: >-
        Simunovic N. et al., «Effect of early surgery after hip fracture on
        mortality and complications: systematic review and meta-analysis»,
        CMAJ, 2010;182(15):1609–16.
      url: https://doi.org/10.1503/cmaj.092220
      nota: >-
        Revisão de estudos observacionais: operar cedo associa-se a menos
        óbitos, menos pneumonia e menos úlceras de pressão. O ensaio aleatorizado
        HIP ATTACK (Lancet, 2020) testou operar em seis horas e não encontrou
        diferença na mortalidade — o que sustenta o prazo das 48 horas como
        norma de organização, não a corrida ao relógio.
    - citacao: >-
        NICE, «Hip fracture: management», guia clínico CG124, 2011, revisto em
        2023: operar no dia da admissão ou no dia seguinte.
      url: https://www.nice.org.uk/guidance/cg124

- id: cesarianas
  titulo: Partos por cesariana
  grupo: qualidade
  dataset: partos-e-cesarianas
  acumulado_no_ano: true
  numerador: no_de_cesarianas
  denominador: no_de_partos
  unidade: percentagem
  polaridade: neutro
  referencia:
    valor: 15
    rotulo: >-
      Referência histórica da OMS: 10 a 15 %. É o consenso de 1985 — em 2015 a
      OMS deixou de fixar um alvo, por concluir que a taxa ideal é desconhecida
      e que, acima de 10 %, mais cesarianas não estão associadas a menos mortes
      de mães ou de recém-nascidos. Está na escala como marco de leitura, não
      como meta a atingir
    fonte: >-
      Organização Mundial da Saúde, Declaração sobre taxas de cesarianas, 2015
      (WHO/RHR/15.02).
  cautela: >-
    Não ajustado ao risco. Maternidades que recebem gravidezes de alto risco,
    ou que servem populações mais velhas, têm taxas legitimamente mais altas.
    Uma taxa acima da referência não indica, por si só, má prática.

