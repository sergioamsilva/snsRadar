# ---------------------------------------------------------------------------
# Uso de antibióticos — INFARMED
#
# Três classes com significado próprio na resistência antimicrobiana, cada uma
# em proporção do total de antibióticos consumidos no hospital, em DDD (dose
# diária definida). São os únicos indicadores desta ficha que falam da prática
# clínica e não da atividade ou das contas.
#
# Três notas sobre a fonte, todas verificadas:
#   · **Não é acumulada no ano** — ao contrário da maioria das séries do SNS,
#     estes são fluxos mensais. Não leva `acumulado_no_ano`.
#   · O denominador não existe como coluna: o total é a classe mais o resto,
#     construído com `denominador_soma_tambem`.
#   · A fonte publica o rácio em `peso`, mas como **fração** (0,0503) e não em
#     pontos percentuais. Daí `publicado_escala: 100`.
# ---------------------------------------------------------------------------

- id: antibioticos-carbapenemes
  titulo: Peso dos carbapenemes no consumo de antibióticos
  grupo: qualidade
  dataset: antibioticos-carbapenemes
  coluna_entidade: nome_hospital
  coluna_tempo: periodo
  exigir_mes_completo: true
  numerador: ddd_consumidas_carbapenemes
  denominador: ddd_consumidas_carbapenemes
  denominador_soma_tambem: [ddd_consumidas_restantes_antibioticos]
  publicado: peso
  publicado_escala: 100
  unidade: percentagem
  polaridade: subir_e_mau
  descricao: >-
    Proporção do consumo hospitalar de antibióticos que corresponde a
    carbapenemes, medida em dose diária definida. São antibióticos de última
    linha para bactérias multirresistentes: quanto mais se usam, mais depressa
    se perde a única arma que resta contra elas.
  evidencia:
    - citacao: >-
        Organização Mundial da Saúde, «Bacterial priority pathogens list, 2024»:
        as enterobactérias resistentes aos carbapenemes encabeçam a lista de
        prioridade crítica.
      url: https://www.who.int/publications/i/item/9789240093461
    - citacao: >-
        Bell B. G. et al., «A systematic review and meta-analysis of the effects
        of antibiotic consumption on antibiotic resistance», BMC Infectious
        Diseases, 2014;14:13.
      url: https://doi.org/10.1186/1471-2334-14-13
      nota: >-
        A revisão mede a relação entre consumo e resistência sobretudo na
        comunidade; o sentido do efeito é o mesmo no hospital, a magnitude não é
        transponível.
  cautela: >-
    Não está ajustado ao doente. Um centro oncológico, de transplantação ou com
    muitos cuidados intensivos usa legitimamente mais carbapenemes, porque trata
    doentes imunodeprimidos e com infeções mais graves. É uma proporção, não um
    volume: um hospital que reduza todos os antibióticos por igual mantém o
    mesmo valor. A fonte atribui a cada hospital um grupo de comparação da ACSS
    (A a F, mais psiquiátricos), que seria a base justa para comparar — o
    snsRadar mostra por agora a mediana de todas as unidades.

