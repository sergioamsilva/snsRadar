# ---------------------------------------------------------------------------
# Gastos por doente padrão
#
# O «doente padrão» é a métrica com que a ACSS converte a atividade heterogénea
# de um hospital — internamentos, consultas, urgências, ambulatório — numa
# unidade única de produção. É o que falta a todos os indicadores de dinheiro
# que o snsRadar já tinha: sem ele, comparar gastos entre uma ULS e um centro
# oncológico não significa nada.
#
# A série começa em 2018 e não antes. Em 2018 a contabilidade pública passou
# para o SNC-AP, e a própria ACSS mantém as duas séries separadas por não serem
# comparáveis. Herdar essa separação é mais honesto do que colar as duas pontas.
#
# Vão todos com polaridade neutra. A ACSS lê o gasto mais baixo do grupo como o
# mais eficiente e calcula a partir dele poupanças estimadas; num portal cívico,
# gastar menos por doente tanto pode ser eficiência como falta de meios, e os
# dados não distinguem as duas coisas.
# ---------------------------------------------------------------------------

- id: gastos-operacionais-doente-padrao
  titulo: Gastos operacionais por doente padrão
  grupo: dinheiro
  dataset: bh-acss-cust-opr-doente-padrao-sncap
  numerador: numerador
  denominador: denominador
  publicado: valor
  unidade: euros
  polaridade: neutro
  descricao: >-
    O que a instituição gasta, ao todo, por cada unidade de produção ajustada à
    complexidade do que trata. É a única forma de pôr lado a lado o custo de um
    hospital central e o de uma unidade local.
  cautela: >-
    O doente padrão pode não captar toda a carteira de serviços de uma
    instituição — a ressalva é da própria ACSS. Gastar menos não é, por si,
    gerir melhor: pode ser não ter com que gastar.

- id: gastos-pessoal-doente-padrao
  titulo: Gastos com pessoal por doente padrão
  grupo: dinheiro
  dataset: bh-acss-cust-pessoal-doente-padrao-sncap
  numerador: numerador
  denominador: denominador
  publicado: valor
  unidade: euros
  polaridade: neutro
  descricao: >-
    A parte dos gastos que vai para quem trata, por unidade de produção
    ajustada.
  cautela: >-
    Ver os gastos operacionais por doente padrão. Um valor baixo pode significar
    escassez de profissionais e não contenção de custos.

- id: gastos-medicamentos-doente-padrao
  titulo: Gastos com medicamentos por doente padrão
  grupo: dinheiro
  dataset: bh-acss-cust-medicamentos-doente-padrao-sncap
  numerador: numerador
  denominador: denominador
  publicado: valor
  unidade: euros
  polaridade: neutro
  descricao: >-
    Gasto em medicamentos por unidade de produção ajustada. Sobe legitimamente
    em unidades com oncologia, doenças raras ou terapêuticas biológicas.
  cautela: >-
    Fortemente dependente da carteira de serviços, mesmo depois do ajustamento.

- id: gastos-material-clinico-doente-padrao
  titulo: Gastos com material de consumo clínico por doente padrão
  grupo: dinheiro
  dataset: bh-acss-cust-mat-cons-clinico-doente-pad-sncap
  numerador: numerador
  denominador: denominador
  publicado: valor
  unidade: euros
  polaridade: neutro
  descricao: >-
    Próteses, dispositivos, consumíveis de bloco e de imagiologia, por unidade
    de produção ajustada.
  cautela: >-
    Sobe onde há mais cirurgia e cardiologia de intervenção.

- id: doentes-padrao-por-medico
  titulo: Doentes padrão por médico
  grupo: capacidade
  dataset: bh-acss-doente-padrao-medico-etc
  # Ao contrário dos restantes, aqui `valor` não se reconstrói a partir do
  # numerador e do denominador exportados: a ACSS divide o doente padrão pelos
  # médicos ETC, e o que exporta é o total de horas semanais. O quociente entre
  # os dois varia de 7 a 35 horas por ETC, porque os regimes de horário
  # convivem. Sem uma constante defensável, fica a taxa que a fonte publica —
  # e `ja_e_taxa` faz o resto do pipeline tomar a mediana dos meses em vez de
  # somar o que não se soma.
  ja_e_taxa: true
  numerador: valor
  unidade: contagem
  polaridade: neutro
  descricao: >-
    Unidades de produção ajustadas à complexidade por cada médico equivalente a
    tempo completo. É a medida de produtividade que a ACSS usa, e a única que
    permite comparar quadros médicos de hospitais que tratam coisas diferentes.
  cautela: >-
    Um valor alto tanto pode significar uma equipa produtiva como uma equipa a
    menos para o trabalho que tem. O indicador não distingue as duas coisas, e a
    leitura isolada de qualquer uma delas seria abusiva.

- id: doentes-padrao-por-enfermeiro
  titulo: Doentes padrão por enfermeiro
  grupo: capacidade
  dataset: bh-acss-doente-padrao-enf-etc
  ja_e_taxa: true
  numerador: valor
  unidade: contagem
  polaridade: neutro
  descricao: >-
    O mesmo, por enfermeiro equivalente a tempo completo.
  cautela: >-
    Ver os doentes padrão por médico: mede tanto produtividade como escassez.

- id: gastos-operacionais-por-inscrito
  titulo: Gastos operacionais por utente inscrito, por mês
  grupo: dinheiro
  dataset: bh-acss-gastos-opr-inscritos
  numerador: numerador
  denominador: denominador
  publicado: valor
  unidade: euros
  polaridade: neutro
  # «Por mês» não é um pormenor de redação: é o que o número é. Ao contrário de
  # todos os outros denominadores desta casa, os inscritos são um *stock* e não
  # um fluxo — a fonte repete a mesma população em cada mês, e a soma de doze
  # meses dá doze vezes a população. Σnumerador ÷ Σdenominador é, por isso, o
  # gasto de um mês médio, e não o do ano. Descoberto ao confrontar este
  # denominador com a população que ingest/populacao.py apura do INE: dava
  # +1 083 %, ou seja, exatamente doze vezes.
  descricao: >-
    O que a unidade gasta, por mês, por cada pessoa inscrita na sua área.
    Multiplicado por doze dá a despesa anual por pessoa. Só existe a partir de
    2024, e só faz sentido a partir daí: antes da reforma das ULS um hospital
    não tinha população inscrita, tinha doentes que lhe chegavam.
  cautela: >-
    Depende da estrutura etária e da doença da população servida, que o
    indicador não ajusta. Uma população envelhecida custa legitimamente mais.

- id: gastos-fse-doente-padrao
  titulo: Gastos com fornecimentos e serviços externos por doente padrão
  grupo: dinheiro
  dataset: bh-acss-cust-fse-por-doente-padrao-sncap
  numerador: numerador
  denominador: denominador
  publicado: valor
  unidade: euros
  polaridade: neutro
  descricao: >-
    Tudo o que a instituição compra fora: meios complementares de diagnóstico
    contratados, limpeza, alimentação, manutenção, prestações de serviços
    clínicos. Por unidade de produção ajustada.
  cautela: >-
    Uma unidade que contrate serviços a terceiros troca gastos com pessoal por
    gastos aqui. Ler os dois em conjunto diz mais do que qualquer um sozinho.

# ---------------------------------------------------------------------------
# Volume de antibióticos — INFARMED sobre dias de internamento
#
# Os três indicadores acima medem a *composição* do consumo: que fatia de todos
# os antibióticos vai para cada classe. É útil e é insuficiente, e a cautela de
# cada um di-lo: «um hospital que reduza todos os antibióticos por igual mantém
# o mesmo valor». O que falta é o volume.
#
# O denominador que o torna comparável não está no registo do INFARMED — está no
# de ocupação do internamento, noutra fonte, com outra grafia dos nomes e outra
# coluna de entidade. `denominador_dataset` junta os dois depois de o crosswalk
# os reduzir à mesma entidade canónica. É a métrica que a ECDC usa para comparar
# hospitais e países.
# ---------------------------------------------------------------------------

- id: antibioticos-volume
  titulo: Consumo total de antibióticos por 1000 dias de internamento
  grupo: qualidade
  dataset: antibioticos-carbapenemes
  coluna_entidade: nome_hospital
  coluna_tempo: periodo
  exigir_mes_completo: true
  numerador: ddd_consumidas_carbapenemes
  soma_tambem: [ddd_consumidas_restantes_antibioticos]
  denominador_dataset: ocupacao-do-internamento
  denominador_coluna: no_de_dias_de_internamento
  denominador_acumulado_no_ano: true
  fator: 1000
  unidade: por_1000_dias
  polaridade: subir_e_mau
  descricao: >-
    Doses diárias definidas de antibiótico por cada mil dias de internamento. É
    a medida com que a ECDC compara hospitais e países — e, ao contrário do peso
    de cada classe, mede quanto se usa e não só o quê.
  evidencia:
    - citacao: >-
        European Centre for Disease Prevention and Control, «Antimicrobial
        consumption in the EU/EEA»: o consumo hospitalar exprime-se em DDD por
        1000 doentes-dia, para ser comparável entre unidades de dimensão
        diferente.
      url: https://www.ecdc.europa.eu/en/antimicrobial-consumption/surveillance-and-disease-data
  cautela: >-
    Junta duas fontes com perímetros próprios: as DDD são de todo o hospital e
    os dias de internamento só do internamento. Um hospital com muito ambulatório
    ou hospital de dia aparece com consumo mais alto por dia de cama sem que isso
    signifique prescrever pior. Também não está ajustado ao doente.

