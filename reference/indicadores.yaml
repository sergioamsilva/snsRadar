# ===========================================================================
# Benchmarking Hospitalar da ACSS
#
# Segunda fonte, com regras próprias. Três diferenças face ao Portal da
# Transparência, todas verificadas em reference/NOTAS.md:
#
#   · **As séries não são acumuladas no ano.** A ACSS publica o valor do mês.
#     Nenhum destes indicadores leva `acumulado_no_ano` — e é precisamente essa
#     diferença que faz desta fonte uma verificação independente da
#     des-acumulação que o portal obriga a fazer (tests/test_benchmarking_acss.py).
#   · **O numerador e o denominador vêm em colunas com esses nomes**, porque a
#     ingestão os junta a partir de folhas separadas da exportação. A regra da
#     casa mantém-se: Σnumerador ÷ Σdenominador, nunca a média das taxas.
#   · **A comparação justa é dentro do grupo**, não contra o país. Cada unidade
#     traz o seu grupo de financiamento (B a F), apurado pela ACSS por
#     clustering sobre variáveis explicativas do custo, e `nacional.json` traz a
#     mediana de cada grupo ao lado da mediana nacional.
#
# Vários destes indicadores trazem exclusões já aplicadas pela ACSS no
# denominador — é o que os torna comparáveis, e é o que a `descricao` de cada um
# tem de dizer, porque o número sozinho não o revela.
# ===========================================================================

# ---------------------------------------------------------------------------
# Segurança do doente
#
# Dimensão que o snsRadar não tinha. São eventos adversos: coisas que aconteceram
# ao doente por causa do internamento, não por causa da doença que o trouxe. A
# leitura tem uma armadilha própria e recorrente — um valor baixo tanto pode ser
# um hospital seguro como um hospital que codifica mal. Onde a literatura o
# documenta, está escrito na cautela.
# ---------------------------------------------------------------------------

- id: ulceras-pressao
  titulo: Úlceras de pressão adquiridas no internamento
  grupo: seguranca
  dataset: bh-acss-taxa-de-ulceras-de-pressao
  numerador: numerador
  denominador: denominador
  publicado: valor
  # A ACSS define o indicador por mil episódios («x 1000» na fórmula) mas
  # exporta a proporção em bruto. `fator` põe o valor na escala da definição e
  # `publicado_escala` põe os dois lados na mesma unidade antes de os comparar.
  publicado_escala: 1000
  fator: 1000
  unidade: por_1000
  polaridade: subir_e_mau
  descricao: >-
    Episódios de internamento por mil em que o doente desenvolveu uma úlcera de
    pressão. O denominador já exclui os episódios em que a úlcera não é
    atribuível ao internamento — estadias curtas e doentes admitidos com a
    lesão, entre outros.
  evidencia:
    - citacao: >-
        OCDE, «Health at a Glance»: as úlceras de pressão são usadas
        internacionalmente como indicador de segurança do doente por serem, em
        larga medida, evitáveis com cuidados de enfermagem adequados.
      url: https://www.oecd.org/health/health-at-a-glance/
  cautela: >-
    Depende do registo. Um hospital que codifique bem as suas úlceras aparece
    pior do que um que as não registe — e a diferença entre unidades pode medir
    a qualidade do registo em vez da qualidade do cuidado.

- id: laceracoes-parto-instrumentado
  titulo: Lacerações graves em partos vaginais instrumentados
  grupo: seguranca
  dataset: bh-acss-perc-partos-vag-inst-lac-3o4o
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 100
  unidade: percentagem
  polaridade: subir_e_mau
  descricao: >-
    Lacerações de 3.º e 4.º grau — as que atingem o esfíncter anal — em partos
    vaginais assistidos por fórceps ou ventosa. É um dos indicadores de
    segurança obstétrica da OCDE.
  cautela: >-
    O parto instrumentado tem, por si, mais risco de laceração grave do que o
    parto espontâneo; por isso os dois indicadores estão separados e não se
    somam. Também aqui o registo pesa: uma laceração não codificada não aparece.

- id: laceracoes-parto-nao-instrumentado
  titulo: Lacerações graves em partos vaginais não instrumentados
  grupo: seguranca
  dataset: bh-acss-perc-part-vag-n-instr-lac-3-4-gr
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 100
  unidade: percentagem
  polaridade: subir_e_mau
  descricao: >-
    Lacerações de 3.º e 4.º grau em partos vaginais espontâneos, sem fórceps
    nem ventosa.
  cautela: >-
    Não está ajustado ao risco da grávida. Tal como no parto instrumentado, um
    valor baixo pode significar menos lesões ou menos registo.

- id: infecao-cateter-venoso-central
  titulo: Infeções da corrente sanguínea associadas a cateter venoso central
  grupo: seguranca
  dataset: bh-acss-taxa-infec-corr-san-c-cate-ven-c
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 1000
  fator: 1000
  unidade: por_1000
  polaridade: subir_e_mau
  descricao: >-
    Episódios por mil em que o doente contraiu uma infeção da corrente sanguínea
    associada ao cateter venoso central, em adultos e em neonatologia. É a
    infeção hospitalar sobre a qual há mais evidência de que se previne com
    protocolo — as chamadas «bundles» de colocação e manutenção.
  cautela: >-
    Depende do registo e da procura ativa: um serviço que faça hemoculturas por
    rotina encontra mais infeções do que um que só as peça perante suspeita
    clínica.

- id: sepsis-pos-operatoria
  titulo: Sépsis pós-operatória
  grupo: seguranca
  dataset: bh-acss-sepsis-pos-operatoria-p-100000
  numerador: numerador
  denominador: denominador
  publicado: valor
  fator: 100000
  unidade: por_100000
  polaridade: subir_e_mau
  descricao: >-
    Casos de sépsis surgidos depois de uma cirurgia programada, por cada
    100 000 episódios cirúrgicos elegíveis. Conta apenas cirurgia eletiva: uma
    infeção generalizada a seguir a uma operação marcada com antecedência é o
    tipo de acontecimento que a segurança hospitalar existe para evitar.
  cautela: >-
    Sensível à codificação e ao perfil dos doentes operados. Hospitais que
    operam doentes mais complexos têm mais risco, e o indicador não o ajusta.

- id: embolia-trombose-pos-operatoria
  titulo: Embolia pulmonar ou trombose venosa profunda pós-operatória
  grupo: seguranca
  dataset: bh-acss-em-pul-trom-ve-prof-pos-op
  numerador: numerador
  denominador: denominador
  publicado: valor
  fator: 100000
  unidade: por_100000
  polaridade: subir_e_mau
  descricao: >-
    Coágulos surgidos depois da cirurgia, por cada 100 000 episódios cirúrgicos
    elegíveis. É um evento em grande parte evitável com profilaxia adequada, e
    por isso é usado como medida de segurança e não de gravidade.
  cautela: >-
    Depende de se procurar. Um hospital que faça mais exames de imagem encontra
    mais tromboses — o chamado viés de deteção — e aparece pior do que um que
    as não procure.

# ---------------------------------------------------------------------------
# Resultados dos cuidados — indicadores que o portal não publica
# ---------------------------------------------------------------------------

- id: cesarianas-unifetal-termo
  titulo: Cesarianas em gravidezes de termo, feto único e de cabeça para baixo
  grupo: qualidade
  dataset: bh-acss-perc-partos-ces-gest-u-cef-termo
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 100
  unidade: percentagem
  polaridade: subir_e_mau
  descricao: >-
    A taxa de cesarianas restrita às gravidezes de um só feto, de cabeça para
    baixo, às 37 semanas ou mais — fora ficam as situações em que a cesariana é
    quase sempre a decisão certa: prematuridade, apresentação pélvica, gémeos.
    Não exclui, porém, as mulheres com cesariana anterior.
  evidencia:
    - citacao: >-
        American College of Obstetricians and Gynecologists, «Quality-Improvement
        Strategies for Safe Reduction of Primary Cesarean Birth», 2025.
      url: https://www.acog.org/clinical/clinical-guidance/committee-statement/articles/2025/04/quality-improvement-strategies-for-safe-reduction-of-primary-cesarean-birth
  cautela: >-
    Sobe acima da taxa global em 35 das 37 maternidades, e a razão está no
    indicador seguinte: quem já teve uma cesariana volta quase sempre a tê-la, e
    esses partos são de termo, unifetais e cefálicos — caem todos dentro deste
    grupo. Não é, por isso, a medida ajustada ao risco que o nome sugere: para
    isso seria preciso excluir também a cesariana anterior, e a ACSS não publica
    esse indicador de forma utilizável (ver reference/NOTAS.md, secção 22).

- id: parto-vaginal-apos-cesariana
  titulo: Partos vaginais depois de uma cesariana anterior
  grupo: qualidade
  dataset: bh-acss-perc-par-vag-ap-ces-gest-u-c-at
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 100
  unidade: percentagem
  polaridade: subir_e_bom
  descricao: >-
    Entre as grávidas de termo, com um só feto de cabeça para baixo e uma
    cesariana anterior, a proporção que teve parto vaginal. Mede se o hospital
    oferece essa possibilidade ou se trata a cesariana anterior como decisão
    definitiva. Em Portugal, a mediana das maternidades é de zero: a primeira
    cesariana determina, na prática, todos os partos seguintes.
  cautela: >-
    Nem toda a mulher com cesariana anterior é candidata a parto vaginal, e a
    escolha informada da grávida é uma razão legítima para não o tentar. Uma
    taxa alta não é, por si, melhor cuidado.

- id: reinternamentos-30-dias
  titulo: Reinternamentos até 30 dias
  grupo: qualidade
  dataset: bh-acss-perc-reinternamentos-em-30-dias
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 100
  unidade: percentagem
  polaridade: subir_e_mau
  descricao: >-
    Proporção de doentes que voltaram a ser internados no prazo de 30 dias após
    a alta. É a medida clássica de alta prematura ou de continuidade de cuidados
    mal assegurada depois de sair do hospital.
  cautela: >-
    Não está ajustado à gravidade. Doentes crónicos e idosos reinternam mais por
    razões alheias ao internamento anterior — e um hospital que trate doentes
    mais graves aparece pior sem que isso signifique pior cuidado.

- id: internamentos-mais-30-dias
  titulo: Internamentos com mais de 30 dias
  grupo: capacidade
  dataset: bh-acss-perc-inter-com-demora-sup-30-d
  numerador: numerador
  denominador: denominador
  publicado: valor
  publicado_escala: 100
  # Em 2013 e 2014 a taxa que a ACSS publica não corresponde às contagens que
  # publica na mesma linha — em 185 de 6 858 linhas, sempre nesses dois anos.
  # Duas exportações diferentes trazem os mesmos números, pelo que não é ruído
  # de extração: é a fonte a contradizer-se. Mantemos a nossa regra (a taxa é
  # Σnumerador ÷ Σdenominador) e deixamos de confrontar o valor publicado antes
  # de 2015, que é quando os dois passam a reconciliar.
  publicado_reconcilia_desde: '2015-01-01'
  unidade: percentagem
  polaridade: subir_e_mau
  descricao: >-
    Proporção de internamentos que passaram dos 30 dias. Uma parte destes são
    doentes que já têm alta clínica e continuam na cama por não haver resposta
    social ou de cuidados continuados — camas de agudos ocupadas por quem já não
    precisa delas.
  cautela: >-
    Mede tanto a eficiência do hospital como a falta de respostas fora dele. A
    causa não vem nos dados.

# ---------------------------------------------------------------------------
# Volume de intervenções de alto risco
#
# Seis procedimentos em que a literatura documenta relação entre o número de
# casos que um hospital faz por ano e o risco de morte de quem lá é operado.
# Não são indicadores de qualidade: são contagens. O que dizem ao leitor é
# quantas vezes por ano aquela equipa faz aquela operação — e para uma resseção
# do pâncreas isso não é um detalhe administrativo.
#
# Ficam todos com polaridade neutra de propósito. Um hospital com volume baixo
# não está a fazer nada de errado por ter poucos casos; a questão que o volume
# levanta é outra, e é de organização da rede, não de desempenho da unidade.
# ---------------------------------------------------------------------------

- id: volume-ressecao-pancreas
  titulo: Resseções do pâncreas
  grupo: qualidade
  dataset: bh-acss-vol-ressecoes-pancreas
  numerador: valor
  unidade: contagem
  polaridade: neutro
  descricao: >-
    Número de resseções do pâncreas realizadas. É das cirurgias com relação mais
    documentada entre o volume do hospital e a sobrevivência do doente.
  evidencia:
    - citacao: >-
        Birkmeyer J. D. et al., «Hospital volume and surgical mortality in the
        United States», New England Journal of Medicine, 2002;346:1128–37.
      url: https://doi.org/10.1056/NEJMsa012337
      nota: >-
        A diferença de mortalidade entre hospitais de volume alto e baixo é
        maior na resseção do pâncreas do que em qualquer outro procedimento
        estudado.
  cautela: >-
    É uma contagem, não uma medida de resultado. Um volume baixo não diz que
    aquele hospital opera mal; diz que opera poucas vezes.

- id: volume-ressecao-esofago
  titulo: Resseções do esófago
  grupo: qualidade
  dataset: bh-acss-vol-ressecoes-esof
  numerador: valor
  unidade: contagem
  polaridade: neutro
  descricao: >-
    Número de resseções do esófago realizadas. Tal como a do pâncreas, é uma
    cirurgia de alto risco em que o volume do centro conta.
  evidencia:
    - citacao: >-
        Birkmeyer J. D. et al., «Hospital volume and surgical mortality in the
        United States», New England Journal of Medicine, 2002;346:1128–37.
      url: https://doi.org/10.1056/NEJMsa012337
  cautela: >-
    É uma contagem, não uma medida de resultado.

- id: volume-aneurisma-aorta
  titulo: Reparações de aneurismas da aorta abdominal
  grupo: qualidade
  dataset: bh-acss-vol-rep-aneu-aorta-abdominal
