# Definição dos indicadores da ficha de instituição — snsRadar
#
# Cada indicador declara de onde vem e como se calcula. A regra central:
# quando existe um par numerador/denominador, a taxa é SEMPRE
# soma(numerador) / soma(denominador) sobre o período agregado. Nunca a média
# das percentagens mensais — essa daria peso igual a um mês com 12 partos e a
# um mês com 1200.
#
# Campos:
#   id           identificador estável, usado nas URLs e no JSON de saída
#   dataset      dataset de origem em data/raw
#   numerador    coluna a somar (obrigatório)
#   denominador  coluna a somar; ausente = o indicador é uma contagem
#   publicado    coluna onde a fonte publica a taxa já calculada; usada apenas
#                para verificar a nossa aritmética, nunca para apresentar
#   unidade      percentagem | contagem | dias | euros
#   polaridade   subir_e_bom | subir_e_mau | neutro
#   referencia   valor externo de comparação, com fonte
#   cautela      texto obrigatório sempre que a comparação entre instituições
#                puder induzir em erro. Aparece junto ao número no site.

